                            - generic [ref=e687]: "11."
                            - text: "The window sprinkler system: • Is identified at the isolation valve as supplying a window sprinkler system. • Is provided with a placard adjacent to the incoming water service with the following wording: “SPECIAL WINDOW SPRINKLER HEADS ON THIS SYSTEM ARE AN INTEGRAL PART OF THE FIRE SEPARATIONS. THIS WATER SUPPLY MAY ONLY BE SHUT OFF AFTER ALL THE PROPER AUTHORITIES HAVE RECEIVED NOTICE IN WRITING”. - Font size to be 12mm high. - Placard to be ‘RED’ in colour with white lettering. - Mount to existing wall with appropriate anchors. - Adhesive is not acceptable. • Provides a water supply duration for the design area that includes the window sprinklers but not less than the required fire resistance rating of the assembly. Notes: 1. As with all fire protection measures, care to be exercised in the design, installation, and maintenance of the active fire protection system to ensure its reliability throughout the life of the building. 2. Sprinkler-protected glazing may be used as a protected opening in an exposing building face where sprinkler heads are provided only on the interior side of the glazing. 3. Sprinkler-protected glazing may be used in an interior fire separation if sprinkler heads are provided to protect both sides of the glazing. 4. Sprinkler-protected glazing may be used in a sprinklered or an unsprinklered building. The installation of sprinkler-protected glazing will also require the installation of a fire alarm system for the building, as required by Sentence 3.2.4.1.(1)."
